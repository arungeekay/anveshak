# 60 questions (45 EN / 15 KN). gold_sql targets the analyst views (contracts.md §9).
# expect: scalar | rows | chart. Scoring is execution-match (order-insensitive).

# ---------------- English (45) ----------------
- id: q01
  lang: en
  question: "How many chain snatching cases were registered in Bengaluru City in 2026?"
  expect: scalar
  gold_sql: "SELECT COUNT(*) FROM vw_case_360 WHERE crime_sub_head='Chain Snatching' AND district='Bengaluru City' AND year(CrimeRegisteredDate)=2026"

- id: q02
  lang: en
  question: "How many FIRs were registered statewide in 2025?"
