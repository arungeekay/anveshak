- id: q04
  lang: en
  question: "Show the monthly trend of chain snatching in Bengaluru City for 2026."
  expect: chart
  gold_sql: "SELECT date_trunc('month', CrimeRegisteredDate) AS ym, COUNT(*) FROM vw_case_360 WHERE crime_sub_head='Chain Snatching' AND district='Bengaluru City' AND year(CrimeRegisteredDate)=2026 GROUP BY ym ORDER BY ym"

- id: q05
  lang: en
